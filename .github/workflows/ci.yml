name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        # Runtime libs (aiohttp/pyupbit/pandas) are NOT installed intentionally.
        # The test suite is designed to run without live-API dependencies.
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Structure check (file size, eval, print, secrets)
        run: bash bin/check-structure.sh

      - name: Import-direction linter
        run: python3 bin/check-deps.py

      - name: Unit tests
        run: python3 -m pytest tests/ -v
